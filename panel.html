<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Reservas</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f7f6; padding: 15px; color: #333; margin: 0; }
    .contenedor { max-width: 1000px; margin: 20px auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .cabecera { display: flex; flex-direction: column; gap: 10px; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px; }
    
    @media (min-width: 600px) {
      .cabecera { flex-direction: row; justify-content: space-between; align-items: center; }
      body { padding: 20px; }
      .contenedor { padding: 30px; }
    }

    h1 { color: #004d73; margin: 0; font-size: 1.5rem; }
    .btn-salir { background: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; width: fit-content; }
    
    /* Contenedor con scroll para que la tabla no rompa el móvil */
    .tabla-responsive { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; min-width: 600px; }
    
    th, td { padding: 12px; border-bottom: 1px solid #ddd; font-size: 0.9em; }
    th { background-color: #004d73; color: white; }
    tr:hover { background-color: #f1f1f1; }
    .estado { padding: 4px 8px; border-radius: 4px; background: #d4edda; color: #155724; font-size: 0.85em; font-weight: bold; }
  </style>
</head>
<body>

  <div class="contenedor">
    <div class="cabecera">
      <h1>Panel de Reservas</h1>
      <button id="btn-cerrar" class="btn-salir">Cerrar Sesión</button>
    </div>
    
    <div class="tabla-responsive">
      <table>
        <thead>
          <tr>
            <th>Entrada</th>
            <th>Salida</th>
            <th>Habitación</th>
            <th>Huéspedes</th>
            <th>Correo del Cliente</th>
            <th>Estado</th>
          </tr>
        </thead>
        <tbody id="tabla-reservas">
          <tr><td colspan="6">Comprobando seguridad y cargando datos...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://bsyoxosjqwfztldzqzer.supabase.co'; 
    const SUPABASE_KEY = 'sb_publishable_a9uYKXOQ1W6eIPY9hwtxFw_bKWjYaUj'; 
    const clientePanel = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function comprobarAcceso() {
      const { data: { session } } = await clientePanel.auth.getSession();
      if (!session) {
        window.location.href = 'login.html'; 
      } else {
        cargarReservas(); 
      }
    }

    async function cargarReservas() {
      const { data, error } = await clientePanel.from('reservas').select('*').order('fecha_entrada', { ascending: true });
      const tbody = document.getElementById('tabla-reservas');
      
      if (error) {
        tbody.innerHTML = '<tr><td colspan="6">Error al conectar con la base de datos.</td></tr>';
        return;
      }
      
      if (!data || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No hay reservas todavía.</td></tr>';
        return;
      }

      tbody.innerHTML = '';
      data.forEach(reserva => {
        tbody.innerHTML += `
          <tr>
            <td>${reserva.fecha_entrada || '-'}</td>
            <td>${reserva.fecha_salida || '-'}</td>
            <td>${reserva.tipo_habitacion || 'No especificada'}</td>
            <td>${reserva.huespedes || '-'}</td>
            <td>${reserva.correo || '-'}</td>
            <td><span class="estado">${reserva.estado || 'OK'}</span></td>
          </tr>
        `;
      });
    }

    document.getElementById('btn-cerrar').addEventListener('click', async () => {
      await clientePanel.auth.signOut();
      window.location.href = 'login.html';
    });

    comprobarAcceso();
  </script>
</body>
</html>
